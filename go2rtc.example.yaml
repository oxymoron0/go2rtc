    hwdownload,format=nv12,drawtext=text='%{localtime}':x=2:y=20:fontsize=28:fontcolor=white:box=1:boxcolor=black:boxborderw=2:fontfile='/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf',hwupload
